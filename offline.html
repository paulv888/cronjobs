<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Offline - HA Remote</title>
<meta name="theme-color" content="#E9ECE5" />
<link rel="manifest" href="/ha/manifest.json" />
<style>
	html, body { height: 100%; margin: 0; }
	body { background: #E9ECE5; color: #222; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	       display: flex; align-items: center; justify-content: center; padding: 24px; }
	.card { background: #fff; border-radius: 10px; padding: 24px; max-width: 340px; width: 100%;
	        box-shadow: 0 1px 4px rgba(0,0,0,.15); text-align: center; }
	h1 { font-size: 1.15rem; margin: 0 0 8px; }
	p { font-size: .92rem; color: #555; margin: 0 0 18px; line-height: 1.45; }
	button { width: 100%; padding: 12px; font-size: 1rem; border: 0; border-radius: 6px;
	         background: #0d6efd; color: #fff; }
	@media (prefers-color-scheme: dark) {
		body { background: #18191a; color: #e4e6eb; }
		.card { background: #242526; }
		p { color: #adb5bd; }
	}
</style>
</head>
<body>
	<div class="card">
		<h1>No connection</h1>
		<p>The remote needs to reach the house to work, so there is nothing to show while it is offline.</p>
		<button type="button" onclick="window.location.reload()">Try again</button>
	</div>
</body>
</html>
